<!DOCTYPE html>
<!--
  Cartwheel HW4 review app (single file, no CDN). Served by analysis/review_app/server.py.

  Tabs: Review · Taxonomy · Suggestions · Labels · Progress.

  Visual channels, one per dimension:
    role of a block      -> hue of its left border and role label (user blue, tool amber,
                            model text slate, reply green). No block is dimmed by role.
    who wrote a mark     -> highlight style: human = solid yellow fill;
                            agent suggestion = lavender tint + dashed underline + "agent suggestion" tag.
    first failure        -> the flag glyph (CSS ::before, so text offsets are unaffected).
    grouping             -> container: a tool call and its result share one box.
  Notes are free text only. Every write sends by: "human".
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cartwheel HW4 review</title>
<style>
  :root {
    --user: #2563eb; --tool: #b45309; --mtext: #475569; --reply: #047857;
    --bg: #f6f6f4; --panel: #fff; --ink: #1c1f23; --muted: #646b73; --line: #e2e3df;
    --hl: #fde68a; --hl-edge: #d97706; --sugg: #ede9fe; --sugg-edge: #7c3aed; --pending: #bfdbfe;
    --ff: #b91c1c; --ok: #15803d; --bad: #b91c1c; --warn: #92400e; --warnbg: #fef3c7;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); display: flex; flex-direction: column; }
  code, pre, .mono { font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 4px 10px; color: var(--ink); }
  button:hover { border-color: #9ca3af; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  button.good { border-color: var(--ok); color: var(--ok); }
  button.bad { border-color: var(--bad); color: var(--bad); }
  input, select, textarea { font: inherit; border: 1px solid var(--line); border-radius: 6px; padding: 4px 7px; background: #fff; color: var(--ink); }
  textarea { width: 100%; resize: vertical; }
  a { color: var(--user); }

  header { display: flex; align-items: center; gap: 14px; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line); flex: none; }
  header h1 { font-size: 15px; margin: 0; white-space: nowrap; }
  header h1 span { color: var(--muted); font-weight: 400; }
  .tabs { display: flex; gap: 4px; }
  .tabs button { padding: 5px 12px; background: var(--bg); }
  .tabs button.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  .tabs .n { font-size: 11px; background: #e5e7eb; color: var(--ink); border-radius: 8px; padding: 0 6px; margin-left: 4px; }
  .tabs button.active .n { background: #4b5563; color: #fff; }
  .spacer { flex: 1; }
  #source-badge { font-size: 12px; color: var(--muted); max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #saved { font-size: 12px; color: var(--muted); min-width: 120px; text-align: right; }

  #banners .banner { padding: 7px 14px; font-size: 13px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .banner.offline { background: #fff7ed; color: #9a3412; border-bottom-color: #fdba74 !important; }
  .banner.demo { background: #eef2ff; color: #3730a3; }
  .banner.warn { background: var(--warnbg); color: var(--warn); }
  .banner b { font-weight: 700; }

  main { flex: 1; min-height: 0; position: relative; }
  .view { display: none; height: 100%; }
  .view.active { display: block; }
  #view-review.active { display: grid; grid-template-columns: 250px minmax(0, 1fr) 370px; }
  .scroll { overflow: auto; height: 100%; }

  /* ---- conversation list ---- */
  #list-pane { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .filters { padding: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 5px; border-bottom: 1px solid var(--line); }
  .filters input { grid-column: 1 / -1; }
  .filters select { font-size: 12px; padding: 3px; min-width: 0; }
  .list-count { font-size: 12px; color: var(--muted); padding: 4px 10px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
  #conv-list { overflow: auto; flex: 1; }
  #conv-list a { display: grid; grid-template-columns: 18px 1fr auto; gap: 4px; padding: 5px 10px; color: var(--ink); text-decoration: none; border-bottom: 1px solid #f0f0ec; font-size: 13px; }
  #conv-list a.cur { background: #dbeafe; }
  #conv-list a .meta { grid-column: 2 / -1; font-size: 11px; color: var(--muted); }
  .st { font-weight: 700; text-align: center; }
  .st.not_reviewed { color: #9ca3af; }
  .st.has_notes { color: var(--hl-edge); }
  .st.no_failure { color: #0f766e; }
  .legend { font-size: 11px; color: var(--muted); padding: 6px 10px; border-top: 1px solid var(--line); }
  .flag { font-size: 10.5px; background: var(--warnbg); color: var(--warn); border-radius: 8px; padding: 0 6px; white-space: nowrap; }

  /* ---- conversation ---- */
  #conv-pane { overflow: auto; min-height: 0; }
  #conv-head { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 18px 8px; border-bottom: 1px solid var(--line); }
  #conv-head h2 { margin: 0; font-size: 17px; display: inline; }
  .hmeta { color: var(--muted); font-size: 12px; margin-left: 8px; }
  .hrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
  .retried { background: var(--warnbg); color: var(--warn); padding: 3px 8px; border-radius: 6px; font-size: 12.5px; }
  .warnline { color: var(--warn); font-size: 12.5px; }
  #btn-nofail.on { background: #ccfbf1; border-color: #0f766e; color: #0f766e; }
  #conv-wrap { position: relative; display: flex; gap: 18px; padding: 14px 18px 120px; }
  #conv-body { flex: 1; min-width: 0; max-width: 760px; }
  #margin { width: 250px; flex: none; position: relative; }

  details.sys { margin-bottom: 14px; font-size: 13px; }
  details.sys summary { cursor: pointer; color: var(--muted); }
  details.sys pre { white-space: pre-wrap; background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 8px; font-size: 12px; max-height: 420px; overflow: auto; }
  .turn { margin-bottom: 26px; }
  .turn-head { font-size: 12px; color: var(--muted); margin: 0 0 6px; display: flex; gap: 8px; align-items: baseline; border-bottom: 1px dashed var(--line); padding-bottom: 3px; }
  .turn-head b { color: var(--ink); font-size: 13px; }
  .blk { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 6px; padding: 7px 11px; margin-bottom: 8px; }
  .blk .role { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 3px; }
  .blk.user { border-left-color: var(--user); } .blk.user .role { color: var(--user); }
  .blk.reply { border-left-color: var(--reply); } .blk.reply .role { color: var(--reply); }
  .blk.mtext { border-left-color: var(--mtext); } .blk.mtext .role { color: var(--mtext); }
  .blk.tool { border-left-color: var(--tool); margin-left: 22px; }
  .blk.tool .role { color: var(--tool); }
  details.blk.tool > summary { cursor: pointer; list-style: none; }
  details.blk.mtext > summary { cursor: pointer; list-style: none; }
  details.blk.mtext > summary .role { display: inline; }
  details.blk.mtext:not([open]) > summary::before { content: '▸ '; color: #9ca3af; }
  details.blk.mtext[open] > summary::before { content: '▾ '; color: #9ca3af; }
  details.blk.mtext > summary .tsum, details.blk.tool > summary .tsum { color: #6b7280; font-size: 12px; }
  details.blk.tool > summary .role { display: inline; margin-right: 6px; }
  details.blk.tool > summary .argsum { color: #6b7280; font-family: ui-monospace, monospace; font-size: 12px; margin-left: 4px; }
  details.blk.tool > summary .tsum { color: #6b7280; font-size: 12px; }
  details.blk.tool:not([open]) > summary::before { content: '▸ '; color: #9ca3af; }
  details.blk.tool[open] > summary::before { content: '▾ '; color: #9ca3af; }
  .txt { white-space: pre-wrap; word-wrap: break-word; }
  .fn { font-family: "SF Mono", ui-monospace, Menlo, monospace; font-weight: 700; font-size: 14px; color: var(--ink); }
  .okf { font-size: 11px; border-radius: 8px; padding: 0 7px; margin-left: 6px; }
  .okf.ok { background: #dcfce7; color: var(--ok); } .okf.err { background: #fee2e2; color: var(--bad); }
  .tool details > summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
  .tool .argsum { font-family: "SF Mono", ui-monospace, Menlo, monospace; }
  .tool .reslabel { font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--tool); margin-top: 6px; }
  pre.json { background: #f6f7f8; border-radius: 5px; padding: 7px 9px; margin: 4px 0 0; font-size: 12.3px; white-space: pre-wrap; word-break: break-word; }
  .notool { font-size: 12px; color: var(--muted); font-style: italic; margin: 0 0 8px 22px; }

  .hl { border-radius: 2px; cursor: pointer; }
  .hl.h { background: var(--hl); }
  .hl.s { border-bottom: 2px dashed var(--sugg-edge); }
  .hl.s:not(.h) { background: var(--sugg); }
  .hl.p { background: var(--pending); }
  .hl.ff::before { content: "⚑"; color: var(--ff); font-weight: 700; margin-right: 1px; }
  .hl.outline, .mnote.outline { outline: 2px solid var(--ink); outline-offset: 1px; }
  .flash { animation: flash 1.2s ease 2; }
  @keyframes flash { 50% { outline: 3px solid var(--user); } }

  .mnote { position: absolute; left: 0; width: 100%; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--hl-edge); border-radius: 5px; padding: 6px 8px; font-size: 12.5px; box-shadow: 0 1px 3px rgba(0,0,0,.07); }
  .mnote.sugg { border: 1px dashed var(--sugg-edge); border-left: 4px dashed var(--sugg-edge); background: #faf7ff; }
  .mnote .tag { font-size: 10px; font-weight: 700; color: var(--sugg-edge); text-transform: uppercase; letter-spacing: .03em; }
  .mnote .ffb { font-size: 10.5px; font-weight: 700; color: var(--ff); }
  .mnote .where { font-size: 10.5px; color: var(--muted); }
  .mnote .acc { font-size: 10px; color: var(--sugg-edge); }
  .mnote .quote { color: var(--muted); font-style: italic; margin: 2px 0; word-break: break-word; }
  .mnote .body { white-space: pre-wrap; word-break: break-word; }
  .mnote .acts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .mnote .acts button { font-size: 11px; padding: 1px 6px; }
  .mnote.human .acts { visibility: hidden; }
  .mnote.human:hover .acts, .mnote.human.editing .acts { visibility: visible; }
  .mnote input.cmt { width: 100%; font-size: 11.5px; margin-top: 4px; }
  .mnote .hist { font-size: 11px; color: var(--muted); border-top: 1px dashed var(--line); margin-top: 4px; padding-top: 3px; }
  .mnote .orphan { font-size: 10.5px; color: var(--warn); }

  #popover { position: fixed; z-index: 200; display: none; width: 340px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.18); padding: 8px; }
  #popover textarea { height: 64px; }
  #popover .hint { color: var(--muted); font-size: 11px; margin-top: 3px; }
  #popover .warnline { margin-top: 3px; }

  /* ---- context pane ---- */
  #ctx-pane { border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 10px 12px 60px; min-height: 0; }
  .sec { margin-bottom: 16px; }
  .sec-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { font-size: 12px; background: #eef0f2; border-radius: 4px; padding: 1px 7px; }
  .chip b { font-weight: 600; color: var(--muted); }
  .facts { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .keybox { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: #fafafa; font-size: 13px; }
  .keybox code { word-break: break-all; font-size: 12px; }
  .ev-item { border-top: 1px solid #f0f0ec; padding: 4px 0; font-size: 12.5px; }
  .ev-item summary { cursor: pointer; }
  .ev-item pre { white-space: pre-wrap; font-size: 12px; background: #f6f7f8; padding: 6px; border-radius: 5px; margin: 4px 0; }
  .tchip { font-size: 10.5px; background: #e0e7ff; color: #3730a3; border-radius: 4px; padding: 0 5px; margin-right: 4px; }
  .rowcard { border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; margin: 5px 0; font-size: 12px; }
  .rowcard .kv { display: grid; grid-template-columns: 110px 1fr; gap: 0 6px; }
  .rowcard .kv span:nth-child(odd) { color: var(--muted); }
  .rowcard .seen { color: var(--muted); font-size: 11px; margin-top: 3px; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }

  /* ---- other views ---- */
  .page { padding: 16px 20px 80px; max-width: 1280px; margin: 0 auto; }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .mode-card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
  .mode-card.st-rejected, .mode-card.st-merged { background: #fafafa; }
  .mc-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .mc-head .name { font-size: 15px; font-weight: 700; }
  .badge { font-size: 10.5px; font-weight: 700; text-transform: uppercase; border-radius: 8px; padding: 1px 7px; }
  .badge.proposed { background: var(--warnbg); color: var(--warn); }
  .badge.accepted { background: #dcfce7; color: var(--ok); }
  .badge.rejected { background: #fee2e2; color: var(--bad); }
  .badge.merged { background: #e0e7ff; color: #3730a3; }
  .badge.pending { background: var(--warnbg); color: var(--warn); }
  .def { margin: 6px 0; white-space: pre-wrap; }
  .checklist { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; margin: 6px 0; }
  .checklist span { border-radius: 4px; padding: 0 6px; }
  .checklist .y { background: #dcfce7; color: var(--ok); } .checklist .n { background: #fee2e2; color: var(--bad); }
  .notes-list { list-style: none; margin: 4px 0; padding: 0; }
  .notes-list li { border-top: 1px dashed var(--line); padding: 3px 0; font-size: 13px; cursor: pointer; }
  .notes-list li:hover { color: var(--user); }
  .grid2 { display: grid; grid-template-columns: 200px 1fr; gap: 6px 10px; align-items: start; margin: 8px 0; }
  .grid2 label { font-weight: 600; font-size: 13px; padding-top: 4px; }
  .grid2 .help { font-size: 11.5px; color: var(--muted); }
  table.t { border-collapse: collapse; width: 100%; background: var(--panel); font-size: 13px; }
  table.t th, table.t td { border: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: top; }
  table.t th { background: #f3f4f6; font-size: 12px; position: sticky; top: 0; z-index: 1; }
  .hist-table td, .hist-table th { font-size: 12px; }
  .cell { width: 100%; min-width: 46px; padding: 2px 0; font-weight: 700; border-radius: 4px; }
  .cell.present { background: #fee2e2; color: var(--bad); border-color: #fca5a5; }
  .cell.absent { background: #e0f2fe; color: #075985; border-color: #7dd3fc; }
  .cell.sug { border-style: dashed; color: var(--muted); }
  .lstrip { flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .lchip { display: inline-flex; align-items: center; gap: 2px; border: 1px solid var(--line); border-radius: 6px; padding: 1px 4px; font-size: 12px; }
  .lchip code { font-size: 11px; margin-right: 3px; }
  .lc { padding: 0 6px; min-width: 22px; }
  .lc.present { background: #fee2e2; color: var(--bad); border-color: #fca5a5; }
  .lc.absent { background: #e0f2fe; color: #075985; border-color: #7dd3fc; }
  .lc.sugp, .lc.suga { border-style: dashed; border-width: 2px; }
  .lc.hintx { border-style: dotted; border-width: 2px; border-color: #a16207; }
  .cell.sel { outline: 2px solid var(--ink); }
  .cell .lf { font-size: 9px; vertical-align: super; color: var(--ok); }
  #label-layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 14px; align-items: start; }
  #label-editor { position: sticky; top: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .tiles { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; min-width: 160px; }
  .tile .big { font-size: 22px; font-weight: 700; }
  .tile .lbl { font-size: 12px; color: var(--muted); }
  .bar-row { display: grid; grid-template-columns: 240px 1fr 140px; gap: 8px; align-items: center; font-size: 13px; margin: 3px 0; }
  .bar { height: 14px; background: #fcd34d; border-radius: 3px; }
  .bar.s { background: repeating-linear-gradient(45deg, #c4b5fd, #c4b5fd 4px, #ede9fe 4px, #ede9fe 8px); }
  .idlink { cursor: pointer; color: var(--user); text-decoration: underline; font-family: "SF Mono", ui-monospace, monospace; font-size: 12px; }
  .empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
  h3.sec-h { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 20px 0 8px; }
  #toast { position: fixed; right: 16px; bottom: 16px; z-index: 300; background: var(--ink); color: #fff; padding: 9px 14px; border-radius: 8px; font-size: 13px; max-width: 420px; opacity: 0; pointer-events: none; transition: opacity .2s; }
  #toast.show { opacity: 1; }
  #toast.err { background: var(--bad); }
</style>
</head>
<body>
<header>
  <h1>Cartwheel <span>HW4 review</span></h1>
  <div class="tabs" id="tabs">
    <button data-view="review" class="active">Review</button>
    <button data-view="taxonomy">Taxonomy <span class="n" id="n-modes">0</span></button>
    <button data-view="suggestions">Suggestions <span class="n" id="n-sugg">0</span></button>
    <button data-view="labels">Labels</button>
    <button data-view="progress">Progress</button>
  </div>
  <div class="spacer"></div>
  <span id="source-badge"></span>
  <button id="btn-reload" title="Fetch the support- traces from Langfuse again and refresh the cache">Reload from Langfuse</button>
  <span id="saved"></span>
</header>
<div id="banners"></div>
<main>
  <section id="view-review" class="view active">
    <aside id="list-pane">
      <div class="filters">
        <input id="f-q" placeholder="filter by id, e.g. 0238" />
        <select data-f="batch"></select>
        <select data-f="status"></select>
        <select data-f="role"></select>
        <select data-f="intent"></select>
        <select data-f="record_state"></select>
        <select data-f="group"></select>
      </div>
      <div class="list-count"><span id="list-count"></span><span>j / k</span></div>
      <div id="conv-list"></div>
      <div class="legend"><span class="st not_reviewed">○</span> not reviewed · <span class="st has_notes">✎</span> has notes · <span class="st no_failure">✓</span> no failure observed</div>
    </aside>
    <section id="conv-pane">
      <div id="conv-head"></div>
      <div id="conv-wrap"><div id="conv-body"></div><div id="margin"></div></div>
    </section>
    <aside id="ctx-pane"></aside>
  </section>
  <section id="view-taxonomy" class="view scroll"><div class="page" id="taxonomy"></div></section>
  <section id="view-suggestions" class="view scroll"><div class="page" id="suggestions"></div></section>
  <section id="view-labels" class="view scroll"><div class="page" id="labels"></div></section>
  <section id="view-progress" class="view scroll"><div class="page" id="progress"></div></section>
</main>
<div id="popover">
  <textarea id="note-input" placeholder="What went wrong? Your own words. Enter saves, Shift+Enter adds a line, Esc cancels."></textarea>
  <div class="hint" id="pop-hint"></div>
  <div class="warnline" id="pop-warn"></div>
</div>
<div id="toast"></div>

<script>
'use strict';
/* ================================================================== *
 * state, api, utilities                                               *
 * ================================================================== */
const S = {
  status: null, list: [], convCache: {}, curId: null, conv: null, blockText: {},
  annotations: [], patterns: { modes: [] }, suggestions: [], manifest: { batches: [] }, labels: {}, progress: null,
  filters: { q: '', batch: '', status: '', role: '', intent: '', record_state: '', group: '' },
  view: 'review', pending: null, version: '', editingMode: null, newMode: false, labelSel: null,
  suggFilter: { status: 'pending', mode: '', q: '' }, labelBatch: '', taxStatus: '', staleViews: new Set(), open: {},
};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clip = (s, n) => { s = String(s ?? ''); return s.length > n ? s.slice(0, n) + '…' : s; };
const short = s => s ? String(s).slice(0, 8) + '…' : '';
const fmtTime = t => t ? String(t).replace('T', ' ').replace(/\.\d+/, '').replace('+00:00', 'Z') : '';

async function api(path, body) {
  const opt = body === undefined ? {} : {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(Object.assign({ by: 'human' }, body)),
  };
  if (body !== undefined) $('saved').textContent = 'Saving…';
  const res = await fetch(path, opt);
  let data = null;

/* ---- labels for this conversation (Part E): one chip per accepted mode ---- */

}

    parts.push(`<div class="blk user"><div class="role">User</div>${annot(`t${t.index}.user`, t.user)}</div>`);
    if (!t.steps.some(s => s.kind === 'tool')) parts.push('<div class="notool">no tool calls in this turn</div>');
    t.steps.forEach(s => {

        // (the skill: it can contain the bug). Opens by itself when it carries a note or suggestion.
        const mOpen = ' ' + openAttr(base + '.text', S.expandTools || hot.has(base + '.text'));
        parts.push(`<details class="blk mtext"${mOpen}><summary><span class="role">Model text${s.with_tool_call ? ' before a tool call' : ''}</span> <span class="tsum">· not sent to the user · “${esc(clip(s.text || '', 90))}”</span></summary>${annot(base + '.text', s.text)}</details>`);

function applyHighlights() {

  if (S.pending) (byTarget[S.pending.target] = byTarget[S.pending.target] || []).push({ s: S.pending.start, e: S.pending.end, id: '__pending', kind: 'pending' });

    const text = S.blockText[el.dataset.target], ranges = byTarget[el.dataset.target];
    if (!ranges) { el.textContent = text; return; }
    const cuts = [...new Set([0, text.length, ...ranges.flatMap(r => [r.s, r.e])])].sort((a, b) => a - b);
    let out = '';

      const cls = 'hl' + (k.has('human') ? ' h' : '') + (k.has('sugg') ? ' s' : '') + (k.has('pending') ? ' p' : '') + (ff ? ' ff' : '');
      out += `<span class="${cls}" data-items="${esc(cover.map(r => r.id).join(' '))}">${seg}</span>`;
    }

    span.onmouseleave = () => document.querySelectorAll('.mnote.outline').forEach(n => n.classList.remove('outline'));

function renderLabels() {

  const cells = reviewed.length * acc.length;
  const decided = acc.reduce((n, m) => n + reviewed.filter(c => rowsBy[m.name][c.id]).length, 0);
  const unwritten = acc.reduce((n, m) => n + (S.labels[m.name] || []).filter(r => !r.langfuse_written).length, 0);
  let h = `<div class="toolbar"><b>Label grid</b><span class="small">${reviewed.length} reviewed conversations × ${acc.length} accepted modes · ${decided}/${cells} cells decided</span>
    <select id="lab-batch"><option value="">all batches</option>${(S.manifest.batches || []).map(b => `<option ${S.labelBatch === b.name ? 'selected' : ''}>${esc(b.name)}</option>`).join('')}</select>

    <div class="small muted" style="margin-bottom:8px">P = present (failure observed, evidence required) · A = absent · <span style="color:var(--ok)">●</span> written to Langfuse. Saves to <code>${esc(S.status ? S.status.state_dir : '')}/labels/&lt;mode&gt;.jsonl</code>.</div>`;
  if (!acc.length) { el.innerHTML = h + '<div class="empty">Accept at least one mode in the Taxonomy tab to start labelling.</div>'; bindLabels(); return; }
  if (!reviewed.length) { el.innerHTML = h + '<div class="empty">No reviewed conversations yet.</div>'; bindLabels(); return; }
  h += `<div id="label-layout"><div><table class="t"><tr><th>conversation</th><th>batch</th><th>review</th>${acc.map(m => `<th title="${esc(m.definition)}"><code>${esc(m.name)}</code></th>`).join('')}</tr>`;
  h += `<tr><td colspan="3" class="small muted">code-check suggestions</td>${acc.map(m => { const n = reviewed.filter(c => !rowsBy[m.name][c.id] && sugHigh(m.name, c.id)).length, np = reviewed.filter(c => !rowsBy[m.name][c.id] && (sugHigh(m.name, c.id) || {}).decision === 'present').length;
    return `<td>${n ? `<button class="colsug" data-m="${esc(m.name)}" title="Check the ${np} suggested P cells in this column first">Confirm ${n} (${np} P)</button>` : ''}</td>`; }).join('')}</tr>`;
  h += reviewed.map(c => `<tr><td><span class="idlink" data-goto="${esc(c.id)}">${esc(c.id)}</span></td><td class="small">${esc(batchOf(c.id) || '—')}</td><td><span class="st ${convStatus(c.id)}">${ICON[convStatus(c.id)]}</span></td>
    ${acc.map(m => { const r = rowsBy[m.name][c.id]; const sel = S.labelSel && S.labelSel.c === c.id && S.labelSel.m === m.name;
      const s = !r ? sugOf(m.name, c.id) : null, hint = s && s.confidence === 'hint';

    <div class="tile"><div class="big">${p.with_notes}</div><div class="lbl">with notes</div></div>
    <div class="tile"><div class="big">${p.no_failure}</div><div class="lbl">no failure observed</div></div>
    <div class="tile"><div class="big">${p.label_grid.decided}/${p.label_grid.cells}</div><div class="lbl">label cells decided</div></div>
    <div class="tile"><div class="big">${p.suggestions.pending}</div><div class="lbl">suggestions pending · ${p.suggestions.accepted} accepted · ${p.suggestions.rejected} rejected</div></div>
    <div class="tile"><div class="big">${acc}</div><div class="lbl">accepted modes · ${prop} proposed</div></div></div>`;
  h += `<h3 class="sec-h">Batches (sample_manifest.json${S.manifest.dimension ? ' · dimension ' + esc(S.manifest.dimension) : ''})</h3>`;
  h += p.batches.length ? `<table class="t"><tr><th>batch</th><th>method</th><th>created</th><th>size</th><th>reviewed</th><th>with notes</th><th>no failure</th><th>not reviewed</th></tr>${p.batches.map(b => `<tr><td><b>${esc(b.name)}</b>${b.final ? ' <span class="badge merged">final</span>' : ''}</td><td class="small">${esc(b.method || '')}</td><td class="small">${esc(fmtTime(b.created_at))}</td><td>${b.size}</td><td>${b.reviewed}</td><td>${b.with_notes}</td><td>${b.no_failure}</td><td>${b.not_reviewed_ids.length ? `<details><summary>${b.not_reviewed_ids.length}</summary>${idl(b.not_reviewed_ids)}</details>` : '0'}</td></tr>`).join('')}</table>` : '<div class="empty">No batches yet. The coding agent posts them to /api/samples.</div>';
  h += `<div class="small" style="margin-top:6px"><b>Conversations in a batch with neither a note nor "no failure observed":</b> ${p.batch_conversations_without_judgement.length ? idl(p.batch_conversations_without_judgement) : 'none'}</div>`;
  if (p.reviewed_not_in_any_batch.length) h += `<div class="small warnline" style="margin-top:4px">Reviewed but not in any batch (${p.reviewed_not_in_any_batch.length}): ${idl(p.reviewed_not_in_any_batch)}</div>`;
  const sat = p.saturation || {};
  h += `<h3 class="sec-h">Saturation check</h3>`;
  h += sat.final_batch ? `<div>Final batch <b>${esc(sat.final_batch)}</b> started ${esc(fmtTime(sat.final_batch_started_at))}. Modes first proposed after it started: <b>${sat.modes_first_proposed_after}</b>${sat.modes.length ? ' — ' + sat.modes.map(m => `<code>${esc(m.name)}</code> (${esc(m.status)}, ${esc(m.proposed_by)})`).join(', ') : ''}.</div><div class="small muted">${esc(sat.rule)}</div>` : '<div class="empty">No batches yet.</div>';
  h += `<h3 class="sec-h">Label grid completeness</h3>`;
  h += p.label_grid.modes.length ? `<table class="t"><tr><th>mode</th><th>decided / reviewed</th><th>present</th><th>absent</th><th>sample fraction present</th><th>not written to Langfuse</th><th>missing</th></tr>${p.label_grid.modes.map(g => `<tr><td><code>${esc(g.mode)}</code></td><td>${g.decided}/${g.reviewed}</td><td>${g.present}</td><td>${g.absent}</td><td>${g.sample_fraction_present ?? '—'}</td><td>${g.not_written_to_langfuse}</td><td>${g.missing.length ? `<details><summary>${g.missing.length}</summary>${idl(g.missing)}</details>` : '0'}</td></tr>`).join('')}</table><div class="small muted">Sample fractions describe the reviewed sample, not prevalence.</div>` : '<div class="empty">No accepted modes yet.</div>';
  h += `<h3 class="sec-h">Failure modes</h3>`;
  const live = modes().filter(m => m.status === 'accepted' || m.status === 'proposed').map(m => ({ m, s: modeSupport(m) }));
  const max = Math.max(1, ...live.map(x => x.s.humanActive.length + x.s.acceptedSugg.length));
  h += live.length ? live.sort((a, b) => (b.s.humanActive.length + b.s.acceptedSugg.length) - (a.s.humanActive.length + a.s.acceptedSugg.length)).map(({ m, s }) => `<div class="bar-row"><span><code>${esc(m.name)}</code> <span class="badge ${esc(m.status)}">${esc(m.status)}</span></span>
    <span style="display:flex;gap:2px"><span class="bar" style="width:${100 * s.humanActive.length / max}%" title="human notes"></span><span class="bar s" style="width:${100 * s.acceptedSugg.length / max}%" title="accepted suggestions"></span></span>
    <span class="small">${s.humanActive.length} notes · ${s.acceptedSugg.length} accepted sugg. · ${s.present} present</span></div>`).join('') + '<div class="small muted">solid = your notes · striped = accepted suggestions</div>' : '<div class="empty">No modes yet.</div>';
  h += `<h3 class="sec-h">Suggestions queue (pending)</h3><div id="pq"></div>`;
  el.innerHTML = h;
  el.querySelectorAll('[data-goto]').forEach(x => x.onclick = () => openConversation(x.dataset.goto));
  suggestionQueue($('pq'), { prefix: 'pq', compact: true, filter: { status: 'pending', mode: '', q: '' }, rerender: renderProgress });
}

/* ================================================================== *
 * boot                                                                *
 * ================================================================== */
(async function boot() {
  try { await refreshAll(); } catch (e) { toast('Could not load: ' + e.message, true); return; }
  const [view, id] = location.hash.slice(1).split('/');
  if (view && view !== 'review' && $('view-' + view)) switchView(view, false);
  const start = (id && S.list.find(c => c.id === id)) ? id : (S.list[0] && S.list[0].id);
  if (start) {
    if (view && view !== 'review') { S.convCache[start] = await api('/api/conversation?id=' + encodeURIComponent(start)); S.curId = start; S.conv = S.convCache[start]; }
    else await openConversation(start);
  }
  setInterval(poll, 3000);
})();
</script>
</body>
</html>
